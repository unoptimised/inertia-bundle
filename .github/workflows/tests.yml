name: Tests

on: [push, pull_request]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported floor.
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: '--prefer-lowest'
          # Current LTS across supported PHP versions.
          - php: '8.2'
            symfony: '6.4.*'
          - php: '8.3'
            symfony: '7.4.*'
          - php: '8.4'
            symfony: '7.4.*'
          - php: '8.5'
            symfony: '7.4.*'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - name: Restrict Symfony version
        run: composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.dependencies }}

      - name: Run tests
        run: ./vendor/bin/phpunit